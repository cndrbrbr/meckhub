# MeckHub – Eingangswelt
# Spawn und Figuren setzt man im Spiel: /hub setspawn, /hub figur <spiel> (gespeichert in orte.yml).

# Unter dieser Höhe zurück zum Spawn (Fall ins Leere)
void-y: 0
# Inventar beim Betreten leeren (gilt nicht für meckhub.bypass)
clear-inventory: true
# Platz des Kompass in der Schnellleiste (0–8)
menu-slot: 4
welcome:
  title: "&6&lWillkommen"
  subtitle: "&7Wähle dein Spiel"

# Spiele in der Reihenfolge für das Menü.
#   target: server:<name>            Server im eigenen BungeeCord (Name wie in der BungeeCord-config.yml)
#           transfer:<host>:<port>   anderer Rechner (Zielserver braucht accepts-transfers=true)
#           world:<name>             Welt auf diesem Server (z. B. Multiverse)
#   ping:   Adresse für "x online" (Standard: bei server:<name> der Containername, bei transfer das Ziel;
#           "none" = keine Abfrage)
#   skin:   default:<alex|ari|efe|kai|makena|noor|steve|sunny|zuri>[-slim]  oder  player:<Minecraft-Name>
#   ausruestung: kopf/brust/beine/fuesse/hand/nebenhand: MATERIAL[#rrggbb][@verzierung:muster]
games:
  inigresso:
    name: Inigresso
    beschreibung: Portale erobern, Links ziehen, Felder aufspannen
    target: server:mc2
    farbe: "#7cf04a"
